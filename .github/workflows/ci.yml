name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Test backend and real MongoDB account isolation
        working-directory: api
        run: bash mvnw --batch-mode verify
        env:
          CABINATE_TEST_MONGODB_URI: mongodb://localhost:27017

  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        client: [web, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: ${{ matrix.client }}/package-lock.json
      - run: npm ci
      - run: npm test
      - if: matrix.client == 'web'
        run: npm run lint
      - if: matrix.client == 'web'
        run: npm run build
      - if: matrix.client == 'mobile'
        run: npm run typecheck

  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Test shared HTTP and credentials
        run: node --experimental-strip-types --test shared/tests/*.test.cjs
      - name: Test account migration safeguards
        run: node --test api/scripts/migrate-account.test.cjs

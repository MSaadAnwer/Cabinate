server:
  port: 8080

logging:
  file:
    name: target/cabinate-api.log

cabinate:
  auth:
    issuer: ${CABINATE_AUTH_ISSUER:}
    audience: ${CABINATE_AUTH_AUDIENCE:}
  cors:
    allowed-origins: ${CABINATE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8082}
  seed:
    enabled: ${CABINATE_SEED_ENABLED:false}
    api-enabled: ${CABINATE_SEED_API_ENABLED:false}
  recipes:
    bedrock-token: ${AWS_BEARER_TOKEN_BEDROCK:}
    region: ${AWS_REGION:us-east-1}
    model: ${CABINATE_RECIPE_MODEL:amazon.nova-micro-v1:0}

spring:
  application:
    name: cabinate-api
  mongodb:
    uri: ${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://admin:password123@localhost:27017/cabinate?authSource=admin}}
  data:
    mongodb:
      auto-index-creation: true
